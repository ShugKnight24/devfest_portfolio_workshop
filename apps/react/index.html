<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Professional Portfolio</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="My Professional Portfolio" />
    <meta
      name="description"
      content="Welcome to my portfolio! I'm a developer passionate about building beautiful, functional web applications. Check out my projects and skills."
    />
    <meta
      name="keywords"
      content="portfolio, developer, web development, react, frontend, software engineer"
    />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourportfolio.vercel.app/" />
    <meta property="og:title" content="My Professional Portfolio" />
    <meta
      property="og:description"
      content="Welcome to my portfolio! I'm a developer passionate about building beautiful, functional web applications."
    />
    <meta
      property="og:image"
      content="https://yourportfolio.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="My Portfolio" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://yourportfolio.vercel.app/" />
    <meta name="twitter:title" content="My Professional Portfolio" />
    <meta
      name="twitter:description"
      content="Welcome to my portfolio! I'm a developer passionate about building beautiful, functional web applications."
    />
    <meta
      name="twitter:image"
      content="https://yourportfolio.vercel.app/og-image.png"
    />
    <meta name="twitter:creator" content="@yourusername" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Theme Color for browser UI -->
    <meta name="theme-color" content="#3B82F6" />
    <meta name="msapplication-TileColor" content="#3B82F6" />

    <!-- Preconnect to external resources for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google tag (gtag.js) -->
    <script>
      (function () {
        var gaId = "%VITE_GA_MEASUREMENT_ID%";
        if (gaId && gaId.indexOf("%") === -1 && gaId !== "G-XXXXXXXXXX") {
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(gaId);
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag() { window.dataLayer.push(arguments); }
          gtag("js", new Date());
          gtag("config", gaId);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
