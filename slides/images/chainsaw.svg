<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Chainsaw blade -->
  <rect x="60" y="20" width="130" height="20" rx="4" fill="currentColor" opacity="0.8"/>
  <!-- Teeth along top -->
  <path d="M70 20 L75 12 L80 20" fill="currentColor" opacity="0.6"/>
  <path d="M85 20 L90 12 L95 20" fill="currentColor" opacity="0.6"/>
  <path d="M100 20 L105 12 L110 20" fill="currentColor" opacity="0.6"/>
  <path d="M115 20 L120 12 L125 20" fill="currentColor" opacity="0.6"/>
  <path d="M130 20 L135 12 L140 20" fill="currentColor" opacity="0.6"/>
  <path d="M145 20 L150 12 L155 20" fill="currentColor" opacity="0.6"/>
  <path d="M160 20 L165 12 L170 20" fill="currentColor" opacity="0.6"/>
  <path d="M175 20 L180 12 L185 20" fill="currentColor" opacity="0.6"/>
  <!-- Teeth along bottom -->
  <path d="M70 40 L75 48 L80 40" fill="currentColor" opacity="0.6"/>
  <path d="M85 40 L90 48 L95 40" fill="currentColor" opacity="0.6"/>
  <path d="M100 40 L105 48 L110 40" fill="currentColor" opacity="0.6"/>
  <path d="M115 40 L120 48 L125 40" fill="currentColor" opacity="0.6"/>
  <path d="M130 40 L135 48 L140 40" fill="currentColor" opacity="0.6"/>
  <path d="M145 40 L150 48 L155 40" fill="currentColor" opacity="0.6"/>
  <path d="M160 40 L165 48 L170 40" fill="currentColor" opacity="0.6"/>
  <path d="M175 40 L180 48 L185 40" fill="currentColor" opacity="0.6"/>
  <!-- Blade tip -->
  <ellipse cx="192" cy="30" rx="8" ry="12" fill="currentColor" opacity="0.7"/>
  <!-- Handle/motor housing -->
  <rect x="10" y="15" width="52" height="30" rx="8" fill="currentColor" opacity="0.9"/>
  <!-- Handle grip -->
  <rect x="20" y="45" width="30" height="12" rx="4" fill="currentColor" opacity="0.7"/>
  <!-- Ripcord -->
  <line x1="10" y1="30" x2="2" y2="30" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="2" cy="30" r="3" fill="currentColor" opacity="0.5"/>
</svg>
