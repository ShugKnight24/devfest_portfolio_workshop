<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" fill="none">
  <!-- Cord line — curved, dynamic -->
  <path d="M10 30 Q25 10 40 30 Q55 50 70 30 Q80 20 90 30" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Handle (T-grip) -->
  <rect x="2" y="24" width="16" height="12" rx="4" fill="currentColor" opacity="0.9"/>
  <line x1="10" y1="24" x2="10" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Action lines (speed/pull indicators) -->
  <line x1="30" y1="15" x2="22" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="28" y1="22" x2="20" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="8" x2="26" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Attachment point (where cord meets body) -->
  <circle cx="92" cy="30" r="6" fill="currentColor" opacity="0.6"/>
  <circle cx="92" cy="30" r="3" fill="currentColor" opacity="0.3"/>
</svg>
