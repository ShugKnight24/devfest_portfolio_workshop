<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" fill="none">
  <!-- Contract/scroll body -->
  <rect x="15" y="20" width="50" height="70" rx="4" fill="currentColor" opacity="0.15"/>
  <rect x="15" y="20" width="50" height="70" rx="4" stroke="currentColor" stroke-width="2" opacity="0.8"/>
  <!-- Devil horns on top -->
  <path d="M25 20 Q20 8 15 2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M55 20 Q60 8 65 2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Contract lines (text) -->
  <line x1="25" y1="35" x2="55" y2="35" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="25" y1="43" x2="55" y2="43" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="25" y1="51" x2="55" y2="51" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="25" y1="59" x2="45" y2="59" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <!-- Signature line -->
  <line x1="25" y1="75" x2="55" y2="75" stroke="currentColor" stroke-width="2" opacity="0.6"/>
  <!-- X mark (signature) -->
  <path d="M32 70 L42 80 M42 70 L32 80" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
