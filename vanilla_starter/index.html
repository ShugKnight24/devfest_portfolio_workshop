<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive Portfolio Builder Workshop - Vanilla Starter">
  <meta name="color-scheme" content="light dark">
  <title>Interactive Portfolio Builder - Vanilla Starter</title>
  
  <link rel="stylesheet" href="style.css">
  
  <!-- Load data configuration first -->
  <script src="data.js"></script>
  
  <!-- Inline script to prevent Flash of Unstyled Content (FOUC) by applying themes immediately -->
  <script>
    {
      const themeName = localStorage.getItem("theme") || window.defaultTheme || "default";
      const themes = window.themes;
      if (themes && themes[themeName]) {
        const theme = themes[themeName];
        const root = document.documentElement;
        Object.entries(theme.colors).forEach(([key, value]) => {
          root.style.setProperty(`--color-${key}`, value);
        });
      }

      const savedDarkMode = localStorage.getItem("darkMode");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = savedDarkMode === "true" || (savedDarkMode === null && prefersDark);
      if (isDark) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.add("light-override");
      }
    }
  </script>
</head>
<body>

  <!-- FIXED TOP TOOLBAR -->
  <nav class="toolbar">
    <div class="container toolbar-content">
      <span class="brand">REZE_BOMB Engine</span>
      
      <div class="controls-group">
        <!-- Theme Swapper Dropdown -->
        <div class="dropdown-container">
          <button id="theme-selector-btn" class="btn-control" aria-label="Change Theme" title="Select Theme">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1zM19.3 6.7c.4-.4.4-1 0-1.4l-1.6-1.6c-.4-.4-1-.4-1.4 0l-1.4 1.4-1.4-1.4c-.4-.4-1-.4-1.4 0l-1.6 1.6c-.4.4-.4 1 0 1.4l1.4 1.4-1.4 1.4c-.4.4-.4 1 0 1.4l1.6 1.6c.2.2.5.3.7.3.3 0 .5-.1.7-.3l1.4-1.4 1.4 1.4c.2.2.5.3.7.3.3 0 .5-.1.7-.3l1.6-1.6c.4-.4.4-1 0-1.4l-1.4-1.4 1.4-1.4z"/>
            </svg>
            <span>Themes</span>
          </button>
          <div id="theme-menu" class="dropdown-menu">
            <div class="dropdown-header">Select Theme</div>
          </div>
        </div>

        <!-- Dark Mode Toggle -->
        <button id="dark-mode-toggle" class="btn-control" aria-label="Toggle Dark Mode" title="Toggle Dark Mode">
          <!-- Populated dynamically by app.js -->
        </button>
      </div>
    </div>
  </nav>

  <!-- WORKSHOP STEPPER SECTION (Comment out after completing the workshop) -->
  <section class="section-container stepper-section" id="stepper-root">
    <div class="container">
      <div class="stepper-card">
        <!-- Progress Bar Indicator -->
        <div id="step-progress" class="stepper-progress"></div>
        <p id="step-indicator" class="stepper-step-indicator"></p>
        
        <!-- Step Contents -->
        <h2 id="step-title" class="stepper-title gradient-text"></h2>
        <code id="step-code" class="stepper-code-block"></code>
        <p id="step-desc" class="stepper-desc"></p>
        
        <div id="step-note" class="stepper-note"></div>
        
        <div id="step-img-container" class="stepper-image-container">
          <img id="step-img" class="stepper-img" src="" alt="">
        </div>
        
        <!-- Navigation Controls -->
        <div class="stepper-buttons">
          <button id="step-prev" class="btn-control btn-nav">← Previous</button>
          <button id="step-next" class="btn-control btn-nav">Next →</button>
        </div>
      </div>
    </div>
  </section>

  <!--

    Uncomment these placeholder roots one by one as you complete the stages
    of the workshop slides.
    
    Once uncommented, update your data in `data.js` and uncomment the 
    corresponding render functions in `app.js` to see the blocks appear.
  -->

  <!-- Load main script -->
  <script src="app.js"></script>
</body>
</html>
